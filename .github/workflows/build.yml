name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compiler
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Publier le journal d'erreur
        if: failure()
        run: |
          { grep -nE "^e: |error:|What went wrong" -A4 build.log | head -150; echo ----; tail -n 40 build.log; } > /tmp/build-error.log || true
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan build-log
          git rm -rf . -q
          cp /tmp/build-error.log build-error.log
          git add build-error.log
          git commit -q -m "Journal d'erreur du build"
          git push -f origin build-log

      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Noir.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Noir.apk --title "Noir (dernier build)" --notes "APK à installer sur le téléphone."
